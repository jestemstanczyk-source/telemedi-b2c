<script>
(function(){

const fmt=(v,d=1)=>v==null||!isFinite(v)?'–':v.toLocaleString('pl-PL',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(v,d=1)=>v==null||!isFinite(v)?'–':(v*100).toLocaleString('pl-PL',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const $=id=>document.getElementById(id);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const SER=['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
// ---------- decode cubes
function dec(c){const o={cols:Object.keys(c),len:0,dict:{}};for(const k of o.cols){const v=c[k];if(v&&v.dict){o.dict[k]=v.dict;o[k]=Int32Array.from(v.idx)}else{o[k]=Float64Array.from(v)}o.len=o[k].length}return o}
const K=dec(D.K),R=dec(D.R),F1=dec(D.F1),F2=dec(D.F2),SP=dec(D.SP),VD=dec(D.VD),VH=dec(D.VH),Q=dec(D.Q),MV=dec(D.M);
const LBL={acq:'Źródło pozyskania',f_visit_purpose:'Cel 1. wizyty',disc:'Rabat 1. zamówienia',device:'Urządzenie',inapp:'Przeglądarka',f_delay:'Opóźnienie 1. wizyty',region:'Region',src:'Źródło sesji',osb:'System / przeglądarka',visitor:'Nowy / powracający',lp:'Landing page'};
const CH_OF={gs_brand:'google/cpc',gs_generic_erecepta:'google/cpc',gs_generic_l4:'google/cpc',gs_generic_lekarz_online:'google/cpc',gs_generic_specjalisci:'google/cpc',meta_prosp_l4_szybko:'meta/paid_social',meta_prosp_lekarz_online:'meta/paid_social',meta_rmkt_koszyk:'meta/paid_social',tt_prosp_l4_15min:'tiktok/paid_social'};
// ---------- state
const ST={tab:'wzrost',kf:{},ff:{},A:[s2day('2024-10-01'),s2day('2025-09-30')],B:[s2day('2025-10-01'),s2day('2026-09-30')],evOn:{}};
for(const e of C.events)ST.evOn[e.id]=true;
// ---------- filters UI
function msBox(host,key,dict,store){const wrap=document.createElement('div');const lab=document.createElement('label');lab.textContent=LBL[key];wrap.appendChild(lab);
 const box=document.createElement('div');box.className='ms';const ctr=document.createElement('div');
 const b1=document.createElement('button');b1.className='all';b1.textContent='wszystkie';const b2=document.createElement('button');b2.className='all';b2.textContent='żadne';ctr.append(b1,b2);box.appendChild(ctr);
 store[key]=new Set(dict.map((_,i)=>i));
 dict.forEach((v,i)=>{const l=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.dataset.i=i;cb.onchange=()=>{cb.checked?store[key].add(i):store[key].delete(i);render()};l.append(cb,document.createTextNode(v));box.appendChild(l)});
 b1.onclick=()=>{box.querySelectorAll('input').forEach(c=>{c.checked=true;store[key].add(+c.dataset.i)});render()};
 b2.onclick=()=>{box.querySelectorAll('input').forEach(c=>{c.checked=false});store[key].clear();render()};
 box.dataset.key=key;wrap.appendChild(box);host.appendChild(wrap)}
function setMs(host,key,store,vals){const box=$(host).querySelector(`.ms[data-key="${key}"]`);store[key].clear();box.querySelectorAll('input').forEach(c=>{const on=vals==null||vals.includes(box.parentNode&&(F1.dict[key]||K.dict[key])[+c.dataset.i]);c.checked=on;if(on)store[key].add(+c.dataset.i)})}
['acq','f_visit_purpose','disc','device','inapp','f_delay'].forEach(k=>msBox($('kf'),k,K.dict[k],ST.kf));
['src','device','osb','visitor'].forEach(k=>msBox($('ff'),k,F1.dict[k],ST.ff));
msBox($('ff'),'lp',F2.dict.lp,ST.ff);
const lpNote=document.createElement('p');lpNote.className='muted';lpNote.textContent='Landing page jest w osobnej kostce: gdy go zawęzisz, filtry urządzenia i systemu nie działają.';$('ff').appendChild(lpNote);
function setWin(){for(const [id,w,i] of [['aFrom','A',0],['aTo','A',1],['bFrom','B',0],['bTo','B',1]]){$(id).value=day2s(ST[w][i]);$(id).min=D.d0;$(id).max=day2s(ND-1);$(id).onchange=e=>{ST[w][i]=Math.max(0,Math.min(ND-1,s2day(e.target.value)));render()}}}
setWin();
// ---------- tabs
const TABS=[['wzrost','Czy to wzrost?'],['kohorty','Kohorty'],['lejek','Lejek'],['wizyty','Wizyty i opóźnienia'],['zdarzenia','Zdarzenia'],['prio','Priorytety'],['unk','Czego nie wiemy'],['dane','Dane i założenia']];
TABS.forEach(([k,t])=>{const b=document.createElement('button');b.role='tab';b.textContent=t;b.dataset.k=k;b.onclick=()=>go(k);$('tabs').appendChild(b)});
function go(k){ST.tab=k;if(location.hash.slice(1)!==k)history.replaceState(null,'','#'+k);render()}
const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))ST.tab=h;
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(TABS.some(t=>t[0]===k)){ST.tab=k;render()}});
// ---------- SVG line chart
const tip=$('tip');
function lineChart(host,{x,series,xType='day',yFmt=v=>fmt(v,1),events=true,h=300,xFmt}){
 host.innerHTML='';const W=Math.max(320,host.clientWidth||900),H=h,ml=56,mr=14,mt=12,mb=26;
 let lo=Infinity,hi=-Infinity;series.forEach(s=>s.y.forEach(v=>{if(v!=null&&isFinite(v)){lo=Math.min(lo,v);hi=Math.max(hi,v)}}));
 if(!isFinite(lo)){host.innerHTML='<p class="muted" style="padding:20px">Brak danych dla wybranych filtrów. Rozszerz filtry albo okno.</p>';return}
 if(lo>0&&lo<hi*0.6)lo=0;if(hi===lo){hi=lo+1}const pad=(hi-lo)*0.06;const cap=hi<=1&&lo>=0;hi+=pad;if(cap&&hi>1)hi=1;if(lo!==0)lo-=pad;
 const x0=x[0],x1=x[x.length-1];const sx=v=>ml+(v-x0)/((x1-x0)||1)*(W-ml-mr),sy=v=>mt+(1-(v-lo)/(hi-lo))*(H-mt-mb);
 let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="wykres">`;
 const ink2=css('--ink2'),line=css('--line'),ev=css('--ev');
 for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=sy(v);g+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="${line}"/><text x="${ml-6}" y="${y+4}" text-anchor="end" font-size="11" fill="${ink2}">${yFmt(v)}</text>`}
 if(xType==='day'){for(let d=x0;d<=x1;d++){const s=day2s(d);if(s.endsWith('-01')&&(+s.slice(5,7))%3===1){const X=sx(d);g+=`<line x1="${X}" x2="${X}" y1="${mt}" y2="${H-mb}" stroke="${line}" stroke-dasharray="2 3"/><text x="${X+2}" y="${H-8}" font-size="11" fill="${ink2}">${s.slice(0,7)}</text>`}}}
 else{x.forEach(v=>{g+=`<text x="${sx(v)}" y="${H-8}" font-size="11" text-anchor="middle" fill="${ink2}">${xFmt?xFmt(v):v}</text>`})}
 if(events&&xType==='day'){for(const e of C.events){if(!ST.evOn[e.id])continue;const a=s2day(e.d),b=e.e?s2day(e.e):a;if(b<x0||a>x1)continue;const X=sx(Math.max(a,x0)),X2=sx(Math.min(b,x1));
  if(b>a)g+=`<rect x="${X}" y="${mt}" width="${Math.max(1,X2-X)}" height="${H-mt-mb}" fill="${ev}" opacity=".12"/>`;
  g+=`<line x1="${X}" x2="${X}" y1="${mt}" y2="${H-mb}" stroke="${ev}" stroke-width="1.5"/><text x="${X+3}" y="${mt+10}" font-size="11" fill="${ev}" font-weight="600">${e.id}</text>`}}
 series.forEach((s,k)=>{const col=css(s.color||SER[k%8]);let p='',on=false;s.y.forEach((v,i)=>{if(v==null||!isFinite(v)){on=false;return}p+=(on?'L':'M')+sx(x[i]).toFixed(1)+' '+sy(v).toFixed(1);on=true});
  g+=`<path d="${p}" fill="none" stroke="${col}" stroke-width="${s.w||1.7}" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
  if(xType!=='day')s.y.forEach((v,i)=>{if(v!=null&&isFinite(v))g+=`<circle cx="${sx(x[i])}" cy="${sy(v)}" r="3" fill="${col}"/>`})});
 g+=`<line id="hx" x1="0" x2="0" y1="${mt}" y2="${H-mb}" stroke="${ink2}" opacity="0"/></svg>`;
 const div=document.createElement('div');div.innerHTML=g;host.appendChild(div);
 const lg=document.createElement('div');lg.className='legend';lg.innerHTML=series.map((s,k)=>`<span><i style="background:${css(s.color||SER[k%8])}"></i>${s.name}</span>`).join('');host.appendChild(lg);
 const svg=div.firstChild,hx=svg.querySelector('#hx');
 svg.onmousemove=ev=>{const r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)*W/r.width;let i=0,best=1e9;x.forEach((v,j)=>{const dd=Math.abs(sx(v)-px);if(dd<best){best=dd;i=j}});
  hx.setAttribute('x1',sx(x[i]));hx.setAttribute('x2',sx(x[i]));hx.setAttribute('opacity','.5');
  const lab=xType==='day'?day2s(x[i]):(xFmt?xFmt(x[i]):x[i]);const evs=xType==='day'?C.events.filter(e=>ST.evOn[e.id]&&x[i]>=s2day(e.d)&&x[i]<=(e.e?s2day(e.e):s2day(e.d))).map(e=>'<br>'+e.id+': '+e.title):[];
  tip.innerHTML='<b>'+lab+'</b>'+series.map(s=>'<br>'+s.name+': '+yFmt(s.y[i])).join('')+evs.join('');
  const hr=host.getBoundingClientRect();tip.style.display='block';tip.style.left=Math.min(ev.clientX+14,innerWidth-260)+'px';tip.style.top=(ev.clientY+window.scrollY+12)+'px';tip.style.position='absolute'};
 svg.onmouseleave=()=>{tip.style.display='none';hx.setAttribute('opacity','0')}}
// ---------- cohort helpers
const KMET={n:'Nowi pacjenci / dzień',rep:'Retencja (2. zamówienie do dnia N)',ord:'Zamówienia na pacjenta do dnia N',net:'Przychód netto na pacjenta do dnia N (zł)',mar:'Marża na pacjenta do dnia N (zł)',bad:'Zwroty + anulacje na zamówienie do dnia N',ns:'No-show na zamówienie do dnia N',go:'Adopcja GO do dnia N',cac:'CAC (zł, tylko kampanie płatne)',payback:'Marża do dnia N − CAC (zł)'};
const kpass=i=>{for(const k of ['acq','f_visit_purpose','disc','device','inapp','f_delay'])if(!ST.kf[k].has(K[k][i]))return false;return true};
function kDaily(dim){ // returns {keys,[key]:{n:[],m:{rep0..}}}
 const res=new Map();const mets=K.cols.filter(c=>/\d+$/.test(c));
 for(let i=0;i<K.len;i++){if(!kpass(i))continue;const key=dim?K.dict[dim][K[dim][i]]:'wszyscy';let r=res.get(key);if(!r){r={n:new Float64Array(ND)};mets.forEach(m=>r[m]=new Float64Array(ND));res.set(key,r)}
  const d=K.cohd[i];r.n[d]+=K.n[i];for(const m of mets)r[m][d]+=K[m][i]}
 return res}
function spendDaily(){ // spend for selected paid campaigns + affiliate 25/patient handled outside
 const acq=K.dict.acq,sel=new Set([...ST.kf.acq].map(i=>acq[i]));const s=new Float64Array(ND);const sd=SP.dict.utm_campaign;
 for(let i=0;i<SP.len;i++){const c=sd[SP.utm_campaign[i]];if(sel.has(c))s[SP.d[i]]+=SP.spend_pln[i]}return s}
function kSeries(r,metric,age,smooth,spend,minN=0){const y=new Array(ND).fill(null);const lim=ND-1-(['n','cac'].includes(metric)?0:age);
 for(let d=0;d<ND;d++){if(d>lim)continue;const a=Math.max(0,d-smooth+1);let num=0,den=0,sp=0;
  for(let j=a;j<=d;j++){den+=r.n[j];if(metric==='n')num+=r.n[j];else if(metric==='cac'||metric==='payback'){sp+=spend?spend[j]:0;if(metric==='payback')num+=r['mar'+age][j]}
   else if(metric==='bad'||metric==='ns')num+=r[metric+age][j];else num+=r[metric+age][j]}
  if(metric==='n')y[d]=num/(d-a+1);else if(metric==='bad'||metric==='ns'){let o=0;for(let j=a;j<=d;j++)o+=r['ord'+age][j];y[d]=o?num/o:null}
  else if(metric==='cac')y[d]=den?sp/den:null;else if(metric==='payback')y[d]=den?(num-sp)/den:null;else y[d]=den?num/den:null;if(den<minN)y[d]=null}
 return y}
function sumWin(r,[a,b],age,metric,spend){let n=0,num=0,o=0,sp=0;const lim=ND-1-age;for(let d=a;d<=Math.min(b,lim);d++){n+=r.n[d];o+=r['ord'+age][d];sp+=spend?spend[d]:0;if(metric&&!['n','cac','payback'].includes(metric))num+=r[metric+age][d];if(metric==='payback')num+=r['mar'+age][d]}
 if(metric==='bad'||metric==='ns')return{v:o?num/o:null,n};if(metric==='cac')return{v:n?sp/n:null,n};if(metric==='payback')return{v:n?(num-sp)/n:null,n};if(metric==='n')return{v:n,n};return{v:n?num/n:null,n}}

function fpass(F,i){for(const k of ['src','visitor'])if(!ST.ff[k].has(remap(F,k,i)))return false;
 if(F===F1){for(const k of ['device','osb'])if(!ST.ff[k].has(F1[k][i]))return false}else{if(!ST.ff.lp.has(F2.lp[i]))return false}return true}
const remapCache={};function remap(F,k,i){if(F===F1)return F1[k][i];const key=k;if(!remapCache[key]){remapCache[key]=F2.dict[k].map(v=>F1.dict[k].indexOf(v))}return remapCache[key][F2[k][i]]}
function fDaily(split){const F=fCube(split);const res=new Map();for(let i=0;i<F.len;i++){if(!fpass(F,i))continue;const key=split?F.dict[split][F[split][i]]:'wszystkie';let r=res.get(key);if(!r){r={};STEPS.forEach(s=>r[s]=new Float64Array(ND));res.set(key,r)}const d=F.d[i];for(const s of STEPS)r[s][d]+=F[s][i]}return res}
function fRate(r,num,den,d,sm){let a=0,b=0;for(let j=Math.max(0,d-sm+1);j<=d;j++){a+=r[num][j];b+=r[den][j]}return b?a/b:null}
function fWin(r,[a,b]){const o={};STEPS.forEach(s=>{let t=0;for(let d=a;d<=b;d++)t+=r[s][d];o[s]=t});return o}
function topKeys(map,field,k=7){return [...map.entries()].map(([key,r])=>[key,r[field].reduce((a,b)=>a+b,0)]).sort((a,b)=>b[1]-a[1]).slice(0,k).map(e=>e[0])}
function zprop(x1,n1,x2,n2){if(!n1||!n2)return null;const p=(x1+x2)/(n1+n2),se=Math.sqrt(p*(1-p)*(1/n1+1/n2));return se?((x2/n2)-(x1/n1))/se:null}
